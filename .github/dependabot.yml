# Dependency automation. Two ecosystems, one per thing this workspace pins that
# a bot can actually reach: workflow action refs and the JavaScript workspace.
# The Terraform root is deliberately absent - see the note at the bottom.
#
# `commit-message.prefix` is mandatory on every ecosystem, not cosmetic. The
# default subject ("Bump x from y to z") is not a Conventional Commit, so it
# breaks the commit convention and is invisible to the release changelog, which
# is generated from conventional commits.
#
# The JavaScript entry updates a version pinned in the workspace `catalog:` in
# place - pnpm workspace catalogs are supported - so a shared version stays
# pinned in exactly one file and no per-package pin is introduced. Known upstream
# defect: a committed lockfile can drop a catalog package
# (dependabot-core#14339, #11953), so review the first bot pull requests for
# lockfile integrity rather than merging on green.
#
# `open-pull-requests-limit` is set per ecosystem so one ecosystem cannot consume
# the shared default of five and silently starve the others. Major updates are
# deliberately left ungrouped: each arrives as its own reviewable pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns:
          - '*'
    # The shared workflows and actions are called at the moving `v1` tag, which their own
    # repository moves for every backward-compatible change; a bot pinning them would stop that.
    ignore:
      - dependency-name: zeroxsolutions/*

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # nx-managed:start
      # Generated from the installed nx plugins' migrations.json by zeroxsolutions/github-actions
      # nx-dependabot; these move through `nx migrate`. Edit outside the markers.
      - dependency-name: nx
      - dependency-name: '@nx/*'
      - dependency-name: '@babel/runtime' # nx: ~7.27.6
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@expo/cli' # nx: ~56.1.14
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@expo/metro-runtime' # nx: ~56.0.14
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@expo/vector-icons' # nx: ~15.1.0
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@swc-node/register' # nx: ^1.11.1
        update-types: [version-update:semver-major]
      - dependency-name: '@swc/cli' # nx: ~0.8.1
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@swc/core' # nx: ^1.15.5
        update-types: [version-update:semver-major]
      - dependency-name: '@swc/helpers' # nx: ^0.5.18
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@testing-library/react-native' # nx: ~13.2.0
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/jest' # nx: ~30.0.0
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/react' # nx: ^19.0.0
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom' # nx: ^19.0.0
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react' # nx: ^6.0.0
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/coverage-v8' # nx: ^5.0.0
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/ui' # nx: ^5.0.0
        update-types: [version-update:semver-major]
      - dependency-name: babel-jest # nx: ~30.3.0
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: babel-preset-expo # nx: ~56.0.14
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: expo # nx: ~56.0.0
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: expo-splash-screen # nx: ~56.0.10
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: expo-status-bar # nx: ~56.0.4
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: jest # nx: ~30.3.0
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: jest-environment-jsdom # nx: ^30.0.0
        update-types: [version-update:semver-major]
      - dependency-name: jest-expo # nx: ~56.0.4
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: jest-util # nx: ^30.0.0
        update-types: [version-update:semver-major]
      - dependency-name: jsdom # nx: ^27.1.0
        update-types: [version-update:semver-major]
      - dependency-name: next # nx: ~15.5.18
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react # nx: ^19.0.0
        update-types: [version-update:semver-major]
      - dependency-name: react-dom # nx: ^19.0.0
        update-types: [version-update:semver-major]
      - dependency-name: react-native # nx: 0.85.3
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-svg # nx: 15.12.1
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-web # nx: ~0.21.0
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: ts-jest # nx: ^29.4.7
        update-types: [version-update:semver-major]
      - dependency-name: typescript # nx: ~6.0.3
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: verdaccio # nx: ^6.3.2
        update-types: [version-update:semver-major]
      - dependency-name: vite # nx: ^8.0.0
        update-types: [version-update:semver-major]
      - dependency-name: vitest # nx: ^5.0.0
        update-types: [version-update:semver-major]
      # nx-managed:end
      # The types follow the Node major `.tool-versions` runs; a later major describes APIs the
      # runtime lacks. Moved by hand with the runtime.
      - dependency-name: '@types/node'
        versions: ['>=25']

  # No terraform ecosystem here, deliberately. A product root declares no
  # `required_providers` of its own - every constraint lives in a module - and the
  # modules come from the private tf-modules repository, which dependabot cannot
  # reach: it fails the run with `git_dependencies_not_reachable` every time.
  # Provider bumps belong to tf-modules' own dependabot; a product adopts them by
  # moving its `?ref=` tag, which is a reviewed decision rather than a bot's.
