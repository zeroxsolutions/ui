# The pull-request gate. The shared workflow scopes each target set with `affected` and
# sweeps instead when no base commit resolves.
#
# `iac/` is checked by nothing here: it is outside the nx graph, and the pre-commit hook
# formats with prettier, which does not read `.tf`.
#
# No project and no path is named, and the branch list carries both default-branch
# spellings, so the file copies to another repository unchanged.
name: ci

on:
  pull_request:
  push:
    branches: [main, master]

# A superseded gate is worthless: it reports on a commit nobody will ship. Cancelling
# in-flight is safe HERE and not in `cd.yml` - a gate writes nothing outside its runner,
# where a half-finished deploy leaves real state behind.
#
# `github.ref` separates a pull request (`refs/pull/N/merge`) from a branch push, so a PR
# and the master push it later becomes never cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: zeroxsolutions/github-actions/.github/workflows/nx-gate.yml@v1
    with:
      targets: lint typecheck build test

  # Its own job because it starts a Workers runtime: too slow to run on every commit, and
  # a failure here is legible without reading the gate's log.
  e2e:
    uses: zeroxsolutions/github-actions/.github/workflows/nx-gate.yml@v1
    with:
      targets: e2e
