# The pull-request gate. Six jobs:
#
#   gate  - the shared `nx-gate` workflow: the pre-push hook's targets plus
#           `test`, over the projects the change reaches, on a clean checkout.
#   build - `build` over the same projects, less those tagged `build:remote`, whose
#           build runs on a vendor's servers with a login the gate does not hold.
#   e2e   - gate-only. The hook's set stays inside the gate's and never the
#           reverse, so a target that starts a runtime, or runs every spec, lands
#           here instead.
#   visual - gate-only, `test-visual` over the projects the change reaches, in a pinned Playwright image:
#           each capture compared with the committed Linux reference, and on a failure the diffs uploaded.
#   format - the whole tree through the formatter, which no nx target runs.
#   dependabot - the Dependabot config's ignore list checked against what `nx migrate` manages.
#
# Nothing checks `iac/`: it is outside the nx graph, so no job reaches it,
# and the pre-commit hook formats with oxfmt, which does not read `.tf`.
#
# Every job runs on a GitHub-hosted runner, never the organization's self-hosted ones: this
# repository is public, so a pull request from a fork runs its own code on the runner, and a
# self-hosted one keeps its disk and grants the runner user passwordless sudo.
#
# No project is named, the one path is the workspace's own `test-output/visual`, and the branch
# list carries both default-branch spellings, so the file copies to another repository unchanged.
name: ci

on:
  pull_request:
  push:
    branches: [main, master]

# A superseded gate is worthless: it reports on a commit nobody will ship. Cancelling
# in-flight is safe for a gate and not for `cd.yml` - a gate writes nothing outside its runner,
# where a half-finished deploy leaves real state behind.
#
# `github.ref` separates a pull request (`refs/pull/N/merge`) from a branch push, so a PR
# and the master push it later becomes never cancel each other.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: zeroxsolutions/github-actions/.github/workflows/nx-gate.yml@v1
    with:
      runs-on: ubuntu-latest
      targets: lint typecheck test

  # In a job of its own because `--exclude` covers every target of the run, and the tagged
  # projects' lint, typecheck and test still run in `gate`.
  build:
    needs: [gate]
    uses: zeroxsolutions/github-actions/.github/workflows/nx-gate.yml@v1
    with:
      runs-on: ubuntu-latest
      targets: build
      exclude: tag:build:remote

  # The pre-commit hook formats only what it is given, and git runs no hook at all in a worktree
  # whose install never created `.husky/_`, so unformatted files reach master and every later
  # merge reformats them into an unrelated pull request. A sweep, because the files that drift
  # are docs no project owns and `affected` would never reach.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: zeroxsolutions/github-actions/nx-setup@v1
      - run: pnpm nx format:check --all

  # Separate from `gate` so its cost is visible and its failure is legible on its
  # own. `affected` runs it only for changes that can reach it, from the base
  # `nx-gate` resolves out of the event payload.
  e2e:
    uses: zeroxsolutions/github-actions/.github/workflows/nx-gate.yml@v1
    with:
      runs-on: ubuntu-latest
      targets: e2e
      # Each zone has its own e2e project, each in three browsers; a change reaching both ran
      # 14 minutes for the native zone alone and passed 30 (2026-11-03).
      timeout-minutes: 60

  # Its own job rather than `nx-gate`, which admits no step after its targets to upload the diffs from.
  # The references are this runner image's Linux captures, so the job stays on the image that made them;
  # `packages/ui/README.md` says how they are made.
  #
  # Four runners each take a quarter of every project's spec files, as Vitest's `--shard` splits them, so the
  # matrix of styles, themes and widths finishes in the time of a quarter of it.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The references were captured in this image, by digest, with its Chromium and its fonts, so a new
    # `ubuntu-latest` changes no pixel. `test-visual-linux` runs the same digest on a developer's machine,
    # and the two change together.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: zeroxsolutions/github-actions/nx-setup@v1

      # `nx-gate`'s own range resolution, which a push that creates a branch or an unreachable base needs.
      # The container runs as root over a checkout the runner's user owns, which git refuses to read until told.
      - name: Compare every capture with its reference
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          case "$BASE" in ''|0000000000000000000000000000000000000000) BASE='' ;; esac
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            NX_BASE="$BASE" NX_HEAD='${{ github.sha }}' pnpm nx affected -t test-visual -- --shard=${{ matrix.shard }}/4
          else
            pnpm nx run-many -t test-visual -- --shard=${{ matrix.shard }}/4
          fi

      - name: Upload the diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs-${{ matrix.shard }}
          path: test-output/visual/
          if-no-files-found: ignore

  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: zeroxsolutions/github-actions/nx-setup@v1
      - uses: zeroxsolutions/github-actions/nx-dependabot@v1
