# Deploys the pushed branch to the environment of the same name. Promotion is a
# fast-forward, so a higher environment ships the SHA the lower one already validated:
#
#   git push origin master:development
#   git push origin development:production
#
# Not approval-gated: a free-plan private repository answers 422 to a required reviewer
# and 403 to branch protection, so `environment: production` would gate nothing while
# looking gated. Switch back when the plan allows.
name: cd

on:
  push:
    branches: [development, production]

# Cancelling mid-sweep would leave some workers new and some old, so an in-flight run
# finishes rather than being replaced.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The pull-request gate ran on the merge preview, which is not the commit that ships.
  gate:
    uses: zeroxsolutions/github-actions/.github/workflows/nx-gate.yml@v1
    with:
      targets: lint typecheck build test

  deploy:
    needs: [gate]
    uses: zeroxsolutions/github-actions/.github/workflows/nx-deploy.yml@v1
    # Without this a called workflow gets an empty `secrets` context; `environment` below
    # scopes which value each name resolves to.
    secrets: inherit
    with:
      targets: wrangler:deploy
      environment: ${{ github.ref_name }}

  # Publish whatever the workspace declares an `rclone:sync` target for. Identifier-free like
  # the rest of this file: `run-many` matches no project in a repo that declares none and
  # exits 0, the same way `deploy` does.
  #
  # `production` only, and not because production is special - because there is one bucket.
  # The artwork is byte-identical per environment, so a development run would either write
  # the production bucket or find no variables and fail; neither is a second environment.
  #
  # Not a job on `nx-deploy`: that workflow forwards only the two Cloudflare deploy secrets,
  # so an R2 key it does not name never reaches the process, and it always passes `-c <env>`,
  # which `rclone:sync` has no configuration for.
  #
  # This runs on every push to `production`, where a dedicated workflow could have filtered
  # by path - GitHub has `paths:` at workflow level and nothing at job level. The cost of the
  # run that finds nothing moved is 0 B transferred; the 4m14s it still takes is checkout and
  # install, which a path filter would not have saved either (measured 2026-08-22).
  rclone-sync:
    needs: [gate]
    if: github.ref_name == 'production'
    runs-on: self-hosted
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: zeroxsolutions/github-actions/nx-setup@v1

      # `RCLONE_S3_*` is rclone's own naming - `--s3-<flag>` uppercased - so no step in this
      # pipeline renames a value on its way to the tool.
      #
      # Endpoint and bucket name are `vars`, not secrets: neither grants access, and as vars
      # their values read plainly in the run rather than as `***`.
      - name: Sync to R2
        shell: bash
        env:
          RCLONE_S3_ENDPOINT: ${{ vars.RCLONE_S3_ENDPOINT }}
          RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.RCLONE_S3_ACCESS_KEY_ID }}
          RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: pnpm nx run-many -t rclone:sync
