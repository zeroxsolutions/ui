# Deploy the pushed branch to the environment of the same name. Only `development`
# and `production` deploy; the integration branch runs the gate only. Promotion is a
# fast-forward, which carries the validated SHA:
#
#   git push origin master:development
#   git push origin development:production
#
# NOT the approval-gated shape `cd-deploy-through-nx-target-per-env` prescribes: a
# free-plan private repo cannot enforce a required reviewer (422) or branch
# protection (403), so `environment: production` would gate nothing while looking
# gated. Switch back when the plan allows. Record the choice in CLAUDE.md.
#
# CI owns only WHEN code ships - no identity, binding, `terraform apply` or secret.
name: cd

on:
  push:
    branches: [development, production]

# One deploy at a time per branch. In-flight runs are NOT cancelled: killing a
# deploy mid-sweep leaves some workers new and some old.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run the gate on the pushed commit. The pull-request gate ran on the merge
  # preview, which is not the commit that ships.
  gate:
    uses: zeroxsolutions/github-actions/.github/workflows/nx-gate.yml@v1
    with:
      targets: lint typecheck build test

  # `secrets: inherit` is what lets the credentials through - a called workflow gets
  # an empty `secrets` context otherwise; the environment scopes which value wins.
  deploy:
    needs: [gate]
    uses: zeroxsolutions/github-actions/.github/workflows/nx-deploy.yml@v1
    secrets: inherit
    with:
      targets: wrangler:deploy
      environment: ${{ github.ref_name }}

  # Publish whatever the workspace declares an `r2:sync` target for. Identifier-free like
  # the rest of this file: `run-many` matches no project in a repo that declares none and
  # exits 0, the same way `deploy` does.
  #
  # `production` only, and not because production is special - because there is one bucket.
  # The artwork is byte-identical per environment, so a development run would either write
  # the production bucket or find no variables and fail; neither is a second environment.
  #
  # Not a job on `nx-deploy`: that workflow forwards only the two Cloudflare deploy secrets,
  # so an R2 key it does not name never reaches the process, and it always passes `-c <env>`,
  # which `r2:sync` has no configuration for.
  #
  # This runs on every push to `production`, where a dedicated workflow could have filtered
  # by path - GitHub has `paths:` at workflow level and nothing at job level. The cost is one
  # listing and one local pass over the tree to discover nothing moved.
  r2-sync:
    needs: [gate]
    if: github.ref_name == 'production'
    runs-on: self-hosted
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: zeroxsolutions/github-actions/nx-setup@v1

      # `RCLONE_S3_*` is rclone's own naming - `--s3-<flag>` uppercased - so no step in this
      # pipeline renames a value on its way to the tool.
      #
      # Endpoint and bucket name are `vars`, not secrets: neither grants access, and as vars
      # their values read plainly in the run rather than as `***`.
      - name: Sync to R2
        shell: bash
        env:
          RCLONE_S3_ENDPOINT: ${{ vars.RCLONE_S3_ENDPOINT }}
          RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.RCLONE_S3_ACCESS_KEY_ID }}
          RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_S3_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: pnpm nx run-many -t r2:sync
