# Deploy a push to `production`, the one environment the registry has. Promotion is a
# fast-forward, which carries the SHA the master gate validated:
#
#   git push origin master:production
#
# The `production` environment sets no required reviewer, so the push is the approval.
#
# CI decides when code ships and nothing else: it creates no identity or binding, runs no
# `terraform apply`, and provisions no secret.
name: cd

on:
  push:
    branches: [production]

# One deploy at a time per branch, and an in-flight run is left to finish: killing a
# deploy mid-sweep leaves some workers new and some old.
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run the gate on the pushed commit. The pull-request gate ran on the merge
  # preview, which is not the commit that ships.
  gate:
    uses: ./.github/workflows/nx-gate.yml
    with:
      targets: lint typecheck build test

  # `secrets: inherit` is what lets the credentials through - a called workflow gets
  # an empty `secrets` context otherwise; the environment scopes which value wins.
  deploy:
    needs: [gate]
    uses: ./.github/workflows/nx-deploy.yml
    secrets: inherit
    with:
      targets: wrangler:deploy
      environment: ${{ github.ref_name }}

  # Publish whatever the workspace declares an `rclone:sync` target for. Identifier-free like
  # the rest of this file: `run-many` matches no project in a repo that declares none and
  # exits 0, the same way `deploy` does.
  #
  # Not a job on `nx-deploy`: that workflow forwards only the two Cloudflare deploy secrets,
  # so an R2 key it does not name never reaches the process, and it always passes `-c <env>`,
  # which `rclone:sync` has no configuration for.
  #
  # This runs on every push to `production`, where a dedicated workflow could have filtered
  # by path - GitHub has `paths:` at workflow level and nothing at job level. The cost of the
  # run that finds nothing moved is 0 B transferred; the 4m14s it still takes is checkout and
  # install, which a path filter would not have saved either (measured 2026-08-22).
  rclone-sync:
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nx-setup

      # `RCLONE_S3_*` is rclone's own naming - `--s3-<flag>` uppercased - so no step in this
      # pipeline renames a value on its way to the tool.
      #
      # The key is Object Read & Write scoped to the one bucket; an Admin token cannot be
      # bucket-scoped and would carry account-wide R2 write.
      #
      # The bucket name is a `var`: it grants no access, and reads plainly in the run. The
      # endpoint is a secret although it grants none either, because it carries the account id
      # and this repository's run logs are public.
      - name: Sync to R2
        shell: bash
        env:
          RCLONE_S3_ENDPOINT: ${{ secrets.RCLONE_S3_ENDPOINT }}
          RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.RCLONE_S3_ACCESS_KEY_ID }}
          RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: pnpm nx run-many -t rclone:sync
