# blank_issues_enabled is left `true` deliberately. Setting it to `false` hides
# the blank-issue option ONLY from collaborators at Read or Triage level; anyone
# with Write, Maintain, or Admin still sees it labelled "Maintainers only". This
# repository is private with write-level collaborators, so `false` would change
# nothing here. Revisit if the repository ever goes public.
blank_issues_enabled: true

contact_links:
  - name: Architecture rules
    url: https://github.com/zeroxsolutions/ui-sdk/tree/master/.claude/rules
    about: >
      Read the rule that governs an area before proposing a change to how it is
      structured.

  - name: Contributing and local setup
    url: https://github.com/zeroxsolutions/ui-sdk/blob/master/CLAUDE.md
    about: This repository's concrete choices and its workspace inventory.

# No security row here on purpose: GitHub adds the security policy to this
# chooser automatically once SECURITY.md exists, so a contact link for it would
# appear twice.
