# Area options below are worker ROLES, not project names: roles are fixed for
# every product by `naming-projects`, so adding a worker never requires editing
# this file. Never replace them with concrete project names.
#
# No `labels:` key on purpose - a label referenced here but absent from the
# repository is silently skipped, and label sets differ per product. Seed labels
# per repository instead.
name: Bug report
description: Something behaves differently from what the specs or rules require.
body:
  - type: markdown
    attributes:
      value: |
        For a change to existing behaviour, or new work, use the change request
        template instead - this one is for something that is already wrong.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the workspace does this sit in?
      options:
        - edge gateway (*-gateway)
        - HTTP service (*-service)
        - message consumer (*-consumer)
        - scheduled job (*-job)
        - frontend app
        - shared package (packages/*)
        - infrastructure (iac/)
        - workspace / tooling
        - not sure
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did you see it?
      options:
        - local development
        - development environment
        - production environment
        - CI
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: >
        What should happen, and what says so - a rule slug, the contract, or the
        documentation.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happens instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The shortest path to seeing it. Include the exact command if there is
        one - task-runner target, request, or queue message.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or error output
      description: >
        Redact credentials, tokens, and full request bodies before pasting.
        Rendered as a code block, no backticks needed.
      render: shell
    validations:
      required: false
