# Get a checked-out nx workspace ready to run targets: its toolchain, then its dependencies. Every
# job in this repository's workflows composes it after its own checkout, because an action in the
# repository cannot run before the repository is checked out.
#
# mise reads `.tool-versions`, and exports PATH through GITHUB_PATH, which the runner prepends.
# Its own cache keeps the toolchain between runs. The nx cache is not kept: a hosted runner keeps no
# disk between runs, and `actions/cache` holding `.nx/cache` outgrew GitHub's per-repository cache
# limit in another of this organization's repositories.
#
# Third-party actions are pinned by commit SHA, with the tag beside it.
name: nx-setup
description: Install an nx workspace's toolchain and dependencies.

runs:
  using: composite
  steps:
    - name: Install the toolchain
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.8.9

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
