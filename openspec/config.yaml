schema: spec-driven-superpowers

# Shown to AI when creating artifacts.
context: |
  Engineering conventions come from whichever of these sources this repo has —
  consult every one that is present:
    1. Best-practice skill packs — invoke the matching skill for each file's stack
       via your harness's own Skill mechanism: `code-quality` (always) and, by
       stack, `ts-js-best-practices` (publishable libs), `nx-best-practices`
       (workspace), `hono-best-practices`, `reactjs-best-practices`, `react-core`,
       `nextjs-best-practices`. These own the GENERIC TS/JS · framework ·
       workspace conventions. A library-only repo may have ONLY these.
    2. Project rules — `.agents/rules/*.md`, IF present — this repo's PLATFORM /
       architecture / contract / domain conventions. Reference each by its slug.
  Skill packs own GENERIC concerns; local rules own PLATFORM specifics. Never
  duplicate a generic (skill-pack) rule as a local rule.

  Delegate implementation to an implementer subagent (every target harness ships
  its own). It SELF-LOADS the applicable `.agents/rules/*.md` and invokes the
  matching framework skill per file at runtime — so a delegation brief stays LEAN:
  point it at the change's OpenSpec artifacts and name the work; never embed rule
  slugs or skill lists.

# Per-artifact rules — ONLY local deltas the schema/templates/context don't already own.
rules:
  design:
    - When a decision depends on a library or framework API, ground it against
      current documentation via Context7 (resolve-library-id → get-library-docs),
      not model memory, and record the confirmed API shape in the design so
      implementation inherits it.
